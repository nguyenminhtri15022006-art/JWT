<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Boot REST API with ajax</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0d6efd;
            margin-bottom: 15px;
        }
        .user-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #212529;
        }
        .token-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 10px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.8rem;
            text-align: left;
            margin: 15px 0;
            max-height: 90px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div class="container pb-5">
    <div class="profile-container text-center">
        <h3 class="mb-4 text-primary fw-bold">Spring Boot REST API with AJAX Example</h3>
        
        <!-- THÔNG TIN NGƯỜI DÙNG ĐĂNG NHẬP (/users/me) -->
        <img id="images" class="profile-avatar shadow-sm" src="" alt="Avatar">
        <div id="profile" class="user-name"></div>
        <div id="emailDisplay" class="text-muted mb-2"></div>
        <div class="mb-3">
            <span class="badge bg-success px-3 py-2">JWT Nimbus Authenticated (ThS. Nguyễn Hữu Trung)</span>
        </div>
        
        <div class="text-start">
            <small class="text-muted fw-bold">Active JWT Token (lưu tại localStorage.token):</small>
            <div id="tokenDisplay" class="token-box text-secondary"></div>
        </div>
        
        <div class="d-flex justify-content-center gap-2 mt-3">
            <button id="logout" class="btn btn-danger px-4 fw-semibold">Đăng Xuất</button>
            <button id="btnReloadUsers" class="btn btn-outline-primary px-3 fw-semibold">Tải lại danh sách Users</button>
        </div>

        <hr class="my-4">

        <!-- BẢNG DANH SÁCH TẤT CẢ NGƯỜI DÙNG (/users/) -->
        <div class="text-start">
            <h5 class="fw-bold text-secondary mb-3">
                <i class="bi bi-people-fill"></i> Danh sách tất cả người dùng trong Database (API: <code>GET /users/</code>)
            </h5>
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle text-center" id="usersTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 60px">ID</th>
                            <th>Họ và tên</th>
                            <th>Email</th>
                            <th>Ảnh đại diện</th>
                            <th>Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5" class="text-muted">Đang tải dữ liệu người dùng qua JWT...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
