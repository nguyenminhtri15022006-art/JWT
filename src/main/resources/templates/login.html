<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>Xác thực JWT Nimbus - Nguyễn Minh Trí</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .auth-card {
            max-width: 460px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .nav-pills .nav-link.active {
            background-color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="auth-card">
        <h4 class="text-center text-primary mb-1 fw-bold">Demo JWT Spring Boot 3 & Security 6</h4>
        <p class="text-center text-muted small mb-3">Sinh viên: <b>Nguyễn Minh Trí</b> - MSSV: <b>24110359</b></p>
        
        <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Đăng Nhập (/auth/login)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">Đăng Ký (/auth/signup)</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <!-- TAB ĐĂNG NHẬP -->
            <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" name="email" id="email" value="24110359@student.hcmute.edu.vn" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" name="password" id="password" value="123456" required autocomplete="on">
                    </div>
                    <button id="login" type="button" class="btn btn-primary w-100 py-2 fw-semibold">Đăng Nhập</button>
                </form>
                <div class="mt-3 text-center">
                    <small class="text-muted">Tài khoản mặc định: <b>24110359@student.hcmute.edu.vn</b> / <b>123456</b></small>
                </div>
            </div>

            <!-- TAB ĐĂNG KÝ -->
            <div class="tab-pane fade" id="register-pane" role="tabpanel">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên</label>
                        <input type="text" class="form-control" id="regFullName" placeholder="Nhập họ và tên..." required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="Nhập mật khẩu..." required autocomplete="on">
                    </div>
                    <button id="btnRegister" type="button" class="btn btn-success w-100 py-2 fw-semibold">Đăng Ký Tài Khoản</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
